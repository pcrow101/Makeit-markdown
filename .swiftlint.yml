# SwiftLint configuration for Makeit-Markdown.
#
# Warnings are treated as errors in the Xcode project, so lint violations are
# surfaced as warnings here and promoted by `--strict` in CI and the Makefile.

included:
  - Makeit-markdown
  - Makeit-markdownTests
  - Packages/MarkdownKit/Sources
  - Packages/MarkdownKit/Tests

excluded:
  - .build
  - DerivedData
  - Packages/MarkdownKit/.build
  - Packages/MarkdownKit/.swiftpm

# Rules that are off by default but worth enforcing on a new codebase.
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

# Rules that require a full compilation, run via `swiftlint analyze`.
analyzer_rules:
  - unused_import

disabled_rules:
  # Trailing commas are required by the Xcode project file format and are
  # idiomatic in multi-line Swift literals.
  - trailing_comma

line_length:
  warning: 110
  error: 140
  ignores_comments: false
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - of
    - to
    - at

type_name:
  min_length:
    warning: 3
  allowed_symbols: ["_"]

nesting:
  type_level: 2

# Test suites are naturally long and declare many short helper types.
force_unwrapping:
  severity: warning

reporter: xcode
